<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCF9F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Perfmind — Plan d'entraînement</title>
<style>
:root{
  --bg:#FCF9F4;--card:#FFFFFF;--ink:#111111;--mut:#6B6B6B;--line:#E8E2D8;
  --or:#CE5924;--or-soft:#F6E3D8;--on-or:#FFFFFF;--shadow:0 1px 2px rgba(17,17,17,.06);
}
:root[data-theme="dark"]{
  --bg:#141311;--card:#1E1C19;--ink:#F5F1EA;--mut:#A39E95;--line:#2F2C27;
  --or:#E06A33;--or-soft:#3A2418;--on-or:#141311;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0}
.up{text-transform:uppercase;letter-spacing:.04em}
/* header */
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header.top img{height:30px;width:auto;display:block}
.wm{font-size:20px;line-height:1;white-space:nowrap}
.wm b{font-weight:800;font-style:italic;letter-spacing:-.01em}
.wm i{font-weight:300;font-style:italic;letter-spacing:.18em;margin-left:2px}
.sync{margin-left:auto;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.06em}
.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:#5E8C6A}
main{flex:1;padding:16px 16px calc(150px + env(safe-area-inset-bottom))}
/* tabbar */
nav.tabs{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(56px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:6px 0;position:relative}
nav.tabs button span.ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--or);font-weight:700}
.dot{position:absolute;top:2px;right:28%;width:9px;height:9px;border-radius:50%;background:var(--or)}
/* type */
.title{font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.title em{font-style:normal;color:var(--or)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 14px}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--or);color:var(--on-or);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px;padding:12px 18px;border-radius:999px}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 13px;font-size:11px}
.btn.danger{background:transparent;color:#B3261E;border:1.5px solid var(--line)}
.ic-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px;background:var(--card)}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.pill-row::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--card)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.seg button.on{background:var(--or);color:var(--on-or)}
label.f{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;border:2px solid var(--or)}
.pay{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;color:#fff;border:0;flex:none}.pay.ok{background:#16a34a}.pay.ko{background:#dc2626}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--or-soft);color:var(--or)}
.mut{color:var(--mut)}
.small{font-size:12px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
/* day cards */
.day{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
.day.today{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.day.off{opacity:.65}
.day h4{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.sess{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);margin-top:9px}
.sess:first-of-type{margin-top:8px}
.sd{width:10px;height:10px;border-radius:50%;flex:none}
.sess .t{font-weight:700;font-size:14px}
.sess .m{font-size:12px;color:var(--mut)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent;flex:none}
.chk.on{background:var(--or);border-color:var(--or);color:var(--on-or)}
.sess.done .t{text-decoration:line-through;color:var(--mut)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(66px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.rpe{display:flex;flex-direction:column;gap:6px;margin-top:6px}.rpe button{text-align:left;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:var(--card);color:var(--ink)}.rpe button b{display:inline-block;min-width:22px}.rpe button.on{border-color:var(--or);color:var(--or);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:600;background:var(--card)}
.chip.on{border-color:var(--or);color:var(--or)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
tr:last-child td{border-bottom:0}
.zdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* year grid */
.ygrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.yc{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:10px;color:var(--mut);display:grid;place-items:center;position:relative;font-weight:700}
.yc.now{outline:2px solid var(--ink);outline-offset:1px}
.yc.set{color:#fff;border-color:transparent}
.yc .g{position:absolute;top:-4px;right:-3px;font-size:11px}
/* chat */
.bubble{max-width:82%;padding:9px 13px;border-radius:18px;margin:4px 0;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bubble.me{background:var(--or);color:var(--on-or);margin-left:auto;border-bottom-right-radius:5px}
.bubble.th{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.dsep{text-align:center;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px}
.composer{position:sticky;bottom:calc(116px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:10px 0}
.composer input{flex:1}
/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.onb img.mk{width:190px;margin-bottom:10px}
.onb .wm{font-size:38px}
.onb .tag2{margin-top:12px;font-size:12px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.onb .btn{margin-top:12px}
/* timer */
.tm{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.tm.rest{background:#2E5E8C;color:#fff}
.tm .ph{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:14px;opacity:.8}
.tm .big{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:12px 0}
.tm .ex{font-size:26px;font-weight:800;text-transform:uppercase;line-height:1.15}
.tm .nx{margin-top:14px;font-size:14px;opacity:.7}
.tm .bar{width:80%;height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:22px;overflow:hidden}
.tm .bar i{display:block;height:100%;background:var(--or)}
.tm .ctl{display:flex;gap:10px;margin-top:28px}
.wo li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.wo{list-style:none;padding:0;margin:0}
.wo .n{font-weight:800;color:var(--or);min-width:22px}
.wo .c{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
.authf{width:100%;max-width:340px;display:grid;gap:10px;text-align:left;margin:0 auto}
.err{color:#B3261E;font-size:13px;margin:0}
.linkb{background:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:6px;justify-self:center}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:40}
</style>

<body>
<div id="app"></div>
<script src="supabase.js"></script>
<script>
/* ============ Utils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; };
const DJ = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const code = () => Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(2, 8).toUpperCase();
const MC = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtD = d => d.getDate() + ' ' + MC[d.getMonth()];
const fmtPace = kmh => { if (!kmh) return '—'; const m = 60 / kmh; const mm = Math.floor(m); const ss = Math.round((m - mm) * 60); return (ss === 60 ? mm + 1 : mm) + ':' + pad(ss === 60 ? 0 : ss) + '/km'; };
const fmtT = s => { s = Math.max(0, Math.ceil(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };

/* ============ Calcul automatique de la durée ============ */
const CALC_DEF = { foot: 70, AS42: 80, AS21: 85, seuil: 87, AS10: 90, AS5: 95, VMA: 100 };
const calcCfg = () => { let c = {}; try { c = JSON.parse(lsGet('perfmind.calc') || '{}') || {}; } catch (e) {} return { ...CALC_DEF, ...c }; };
const BIKE_T = ['bike', 'bikeint', 'bikelong', 'trainer'];
const nfix = s => String(s || '').replace(/(\d),(\d)/g, '$1.$2').replace(/[–—]/g, '-').replace(/\s+puis\s+/gi, ' + ').replace(/\b(toutes?|tous)\s+les\s+\d+\s*(?:min|mn|['′’]|km|m|h)?/gi, ' ');
function splitTop(s) {
  const out = []; let d = 0, cur = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(') d++; else if (c === ')') d = Math.max(0, d - 1);
    if (!d && ('+,;\n'.includes(c) || (c === '.' && (i === s.length - 1 || /\s/.test(s[i + 1]))))) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out.map(x => x.trim()).filter(Boolean);
}
const RX_REC = /(^|[\s(])(r|rec|récup[a-zé]*|recup[a-zé]*)\s*[:=]?\s*(?=\d)/i;
function cutRec(s) {
  const sl = s.search(/\/(?!\s*(km|h)\b)/i), rk = s.search(RX_REC);
  let i = -1; if (sl >= 0) i = sl; if (rk >= 0 && (i < 0 || rk < i)) i = rk;
  if (i < 0) return [s, ''];
  return [s.slice(0, i), s.slice(i).replace(/^\s*\//, '')];
}
const avg = (a, b) => b != null && b !== '' && !isNaN(+b) ? (+a + +b) / 2 : +a;
/* vitesse (km/h) déduite du texte ; retourne aussi le texte nettoyé */
function getSpeed(s, ctx) {
  let m, kmh = null;
  if ((m = s.match(/(\d+)\s*['′’:]\s*(\d{1,2})?\s*["″]?\s*\/\s*km/i))) { const sec = +m[1] * 60 + (+m[2] || 0); if (sec) kmh = 3600 / sec; s = s.replace(m[0], ' '); }
  if ((m = s.match(/(\d+(?:\.\d+)?)\s*km\s*\/\s*h/i))) { if (kmh == null) kmh = +m[1]; s = s.replace(m[0], ' '); }
  const re = /(\d+(?:\.\d+)?)(?:\s*(?:-|à)\s*(\d+(?:\.\d+)?))?\s*%\s*(?:de\s+(?:la\s+)?)?(vma|ftp|pma|fc\s*max|fcm|fc)?/gi;
  s = s.replace(re, (all, a, b, u) => { if ((!u || /vma/i.test(u)) && kmh == null && ctx.vma) kmh = ctx.vma * avg(a, b) / 100; return ' '; });
  if (kmh == null && ctx.vma) {
    const C = ctx.cfg, kw = [[/\bAS\s*5\b/i, C.AS5], [/\bAS\s*10\b/i, C.AS10], [/\bAS\s*21\b|\bsemi\b/i, C.AS21], [/\bAS\s*42\b|\bmarathon\b/i, C.AS42], [/\bseuil\b/i, C.seuil], [/\bvma\b/i, C.VMA], [/\bEF\b|\bendurance\b|\bfooting\b/i, C.foot]];
    for (const [r, p] of kw) if (r.test(s)) { kmh = ctx.vma * p / 100; break; }
  }
  return [s, kmh];
}
function getTime(s) {
  const c = [];
  let m;
  if ((m = /(\d+(?:\.\d+)?)\s*(?:-|à)\s*(\d+(?:\.\d+)?)\s*(?:min|mn|['′’])/i.exec(s))) c.push([m.index, avg(m[1], m[2]) * 60]);
  if ((m = /(\d+)\s*h(?:eures?)?\s*(\d{1,2})?(?![a-zé])/i.exec(s))) c.push([m.index, +m[1] * 3600 + (+m[2] || 0) * 60]);
  if ((m = /(\d+(?:\.\d+)?)\s*(?:min|mn|['′’])\s*(\d{1,2})?/i.exec(s))) c.push([m.index, +m[1] * 60 + (+m[2] || 0)]);
  if ((m = /(\d+)\s*(?:s|sec|secondes?|["″])(?![a-zé])/i.exec(s))) c.push([m.index, +m[1]]);
  if (!c.length) return 0;
  c.sort((x, y) => x[0] - y[0]); return c[0][1];
}
function getDist(s) {
  const m = /(\d+(?:\.\d+)?)\s*(km|m)(?![a-zé/])(?!\s*d\+)/i.exec(s);
  return m ? (m[2].toLowerCase() === 'km' ? +m[1] : +m[1] / 1000) : 0;
}
function effort(s, ctx, isRec) {
  let kmh; [s, kmh] = getSpeed(s, ctx);
  const run = !ctx.bike, foot = ctx.vma ? ctx.vma * ctx.cfg.foot / 100 : null;
  if (kmh == null) kmh = foot;
  const t = getTime(s), d = getDist(s);
  if (t) return { sec: t, km: isRec ? 0 : (d || (run && kmh ? t / 3600 * kmh : 0)) };
  if (d) { if (run && kmh) return { sec: d / kmh * 3600, km: isRec ? 0 : d }; if (run) ctx.needVma = true; return { sec: 0, km: isRec ? 0 : d }; }
  return { sec: 0, km: 0 };
}
function item(s, ctx) {
  let m;
  if ((m = s.match(/^(.*?)\bdont\b(.*)$/i))) {
    const main = effort(m[1], ctx); if (getTime(m[1]) || !ctx.vma || ctx.bike) { ctx.lastN = 0; return main; }
    const sub = seq(m[2], ctx), foot = ctx.vma * ctx.cfg.foot / 100; ctx.lastN = 0;
    return { sec: Math.max(0, main.sec + sub.sec - sub.km / foot * 3600), km: main.km };
  }
  if (RX_REC.test(' ' + s) && /^\s*(r|rec|récup|recup)/i.test(s)) {
    const r = effort(s.replace(/^\s*\S+/, ''), ctx, true), n = ctx.lastN || 1; ctx.lastN = 0;
    return { sec: r.sec * n, km: 0 };
  }
  if ((m = s.match(/^(.*?)(\d+)\s*[x×*]\s*\((.*)\)(.*)$/i))) {
    const pre = effort(m[1], ctx), n = +m[2], inner = seq(m[3], ctx), rec = effort(cutRec(' ' + m[4])[1] || '', ctx, true);
    ctx.lastN = n; return { sec: pre.sec + n * (inner.sec + rec.sec), km: pre.km + n * inner.km };
  }
  if ((m = s.match(/^(.*?)(\d+)\s*[x×*]\s*(?=\d)(.*)$/i))) {
    const pre = effort(m[1], ctx), n = +m[2], [ef, rc] = cutRec(m[3]);
    const e = effort(ef, ctx), r = rc ? effort(rc, ctx, true) : { sec: 0, km: 0 };
    ctx.lastN = rc ? 0 : n; return { sec: pre.sec + n * (e.sec + r.sec), km: pre.km + n * e.km };
  }
  ctx.lastN = 0;
  const [ef, rc] = cutRec(s), e = effort(ef, ctx), r = rc ? effort(rc, ctx, true) : { sec: 0 };
  return { sec: e.sec + r.sec, km: e.km };
}
function seq(s, ctx) { let sec = 0, km = 0; for (const p of splitTop(s)) { const r = item(p, ctx); sec += r.sec; km += r.km; } return { sec, km }; }
function estimate(desc, a, type) {
  if (type === 'race') return { sec: 0, km: 0, needVma: false };
  const ctx = { vma: +((a || {}).vma) || 0, bike: BIKE_T.includes(type), cfg: calcCfg(), lastN: 0, needVma: false };
  const r = seq(nfix(desc), ctx);
  return { sec: Math.round(r.sec), km: Math.round(r.km * 10) / 10, needVma: ctx.needVma };
}
/* cibles personnalisées : % VMA → allure, % FTP → watts, % FC max → bpm */

let booting = false, chan = null, reloadT = null;
async function boot() {
  if (booting || AUTH.stage === 'recovery') return; booting = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { AUTH.user = null; if (!['confirm', 'forgot', 'signup'].includes(AUTH.stage)) AUTH.stage = 'login'; return render(); }
    AUTH.user = session.user;
    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (error || !prof) { AUTH.err = 'Profil introuvable, réessaie.'; AUTH.stage = 'login'; await sb.auth.signOut(); return render(); }
    S.role = prof.role; S.coach = prof.coach_name || '';
    await loadAll();
    if (S.role === 'athlete') { S.linked = (S.athletes[0] || {}).id || null; ui.tab = 'plan'; AUTH.stage = S.linked ? 'app' : 'link'; }
    else { if (ui.tab === 'plan') ui.tab = 'team'; AUTH.stage = 'app'; }
    AUTH.err = ''; AUTH.info = '';
    if (AUTH.stage === 'app') { subscribeRealtime(); pushRefresh(); }
    render();
  } catch (e) { console.error(e); AUTH.err = FR_ERR(e.message || ''); AUTH.stage = 'login'; render(); }
  finally { booting = false; }
}
function teardown() {
  if (chan) { sb.removeChannel(chan); chan = null; }

function subscribeRealtime() {
  if (chan) return;
  const ch = sb.channel('perfmind-live').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => onMsg(p.new));
  ['sessions', 'weeks', 'goals', 'athletes'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => scheduleReload()));
  ch.subscribe(); chan = ch;
}
function onMsg(r) {

}
function scheduleReload(force) {
  clearTimeout(reloadT);
